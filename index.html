<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edgar Solis · Apps</title>
<meta name="description" content="iOS apps by Edgar Solis.">
<style>
  :root {
    color-scheme: dark;
    --canvas: #0A0A0D;
    --surface: #18181D;
    --hairline: rgba(255,255,255,0.14);
    --text: #F5F5FA;
    --muted: #A3A3B3;
    --accent: #5AAEF7;
    --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.55;
  }
  main { max-width: 680px; margin: 0 auto; padding: 56px 16px 80px; }
  h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -0.01em; }
  .lede { color: var(--muted); font-weight: 600; margin: 12px 0 0; }
  .app {
    margin-top: 36px; padding: 24px; border-radius: 20px;
    background: var(--surface); border: 1px solid var(--hairline);
    display: flex; gap: 18px; align-items: flex-start;
  }
  .ring {
    width: 56px; height: 56px; flex: none;
    border-radius: 50%; border: 7px solid var(--text);
  }
  .app h2 { margin: 0 0 4px; font-size: 22px; }
  .app p { margin: 0 0 14px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px;
    border-radius: 22px; border: 1px solid var(--hairline);
    color: var(--text); font-weight: 700; font-size: 15px; text-decoration: none;
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); }
  footer { margin-top: 56px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Edgar Solis</h1>
  <p class="lede">iOS apps.</p>

  <section class="app">
    <div class="ring" aria-hidden="true"></div>
    <div>
      <h2>Chooserly</h2>
      <p>Let chance decide. Everyone puts a finger on the screen and it picks, or spin a wheel of names.</p>
      <nav class="links" aria-label="Chooserly">
        <a href="chooserly/support/">Support</a>
        <a href="chooserly/privacy/">Privacy Policy</a>
      </nav>
    </div>
  </section>

  <footer>© 2026 Edgar Solis</footer>
</main>
</body>
</html>
